function hzStart(g){
 const P=g.m.map(m=>{let L=0;for(let j=1;j<m.length;j++)L+=Math.hypot(m[j][0]-m[j-1][0],m[j][1]-m[j-1][1]);return Math.max(L,1)});

function hzDraw(){

  const p=Math.min(1,Math.max(0,(a.t-a.st[i])/a.du[i]));

function hzLoop(a,ts){
 if(a!==hzA||!document.getElementById("hzs"))return;
 if(a.run){
  if(a.last)a.t+=(ts-a.last)/1000/a.k;
  a.last=ts;
  if(a.stop!=null&&a.t>=a.stop){a.t=a.stop;a.stop=null;hzRun(false)}
  else if(a.t>=a.T+.8)a.t=0;
 }else a.last=0;
 hzDraw();requestAnimationFrame(x=>hzLoop(a,x));
}

const MAT={"zh":{"1":[["Menyapa, berterima kasih, minta maaf","你 + 好 → 你好","Kata Mandarin tidak berubah bentuk. 你 (kamu) + 好 (baik) menjadi sapaan 'halo'. Tiap ucapan punya pasangan jawaban: 谢谢 dijawab 不客气, 对不起 dijawab 没关系.",[["你好！","nǐ hǎo!","Halo!"],["谢谢！不客气。","xièxie! bú kèqi.","Terima kasih! Sama-sama."],["对不起。没关系。","duìbuqǐ. méi guānxi.","Maaf. Tidak apa-apa."]]]],"2":[["Menyebut nama","我 + 叫 + Nama","叫 (jiào) berarti 'dipanggil'. Untuk bertanya nama dipakai 什么 (apa), dan kata tanya itu tetap berada di tempat jawabannya.",[["我叫小明。","wǒ jiào Xiǎomíng.","Nama saya Xiaoming."],["你叫什么名字？","nǐ jiào shénme míngzi?","Siapa namamu?"]]],["Kalimat dengan 是","A + 是 + B","是 (shì) menghubungkan dua hal yang sama ('adalah'). Untuk menolak, taruh 不 di depan 是.",[["她是小红。","tā shì Xiǎohóng.","Dia adalah Xiaohong."],["我不是小明。","wǒ bú shì Xiǎomíng.","Aku bukan Xiaoming."]]]],"3":[["Menyebut anggota keluarga dan orang","他 / 她 + 是 + 我 + Kerabat","Untuk kerabat dekat, 我 langsung diletakkan di depan tanpa kata penghubung: 我爸爸, 我妈妈, 我同学.",[["他是我爸爸。","tā shì wǒ bàba.","Dia ayahku."],["她是我妈妈。","tā shì wǒ māma.","Dia ibuku."],["他是我同学。","tā shì wǒ tóngxué.","Dia teman sekelasku."]]]],"4":[["Membentuk angka 11 sampai 99","Puluhan + 十 + Satuan","11 = 十一, 20 = 二十, 25 = 二十五. Untuk 11 sampai 19, 十 di depan; untuk 20 ke atas, angka puluhan ditaruh sebelum 十.",[["十一","shíyī","sebelas"],["二十五","èrshíwǔ","dua puluh lima"],["九十九","jiǔshíjiǔ","sembilan puluh sembilan"]]]],"5":[["Bertanya dan menyebut usia","你 + 几岁？ / 我 + Angka + 岁","几 (jǐ) dipakai untuk jumlah kecil, misalnya usia anak. 岁 (suì) adalah satuan tahun usia.",[["你几岁？","nǐ jǐ suì?","Kamu umur berapa? (untuk anak kecil)"],["我二十岁。","wǒ èrshí suì.","Aku berumur 20 tahun."]]],["Punya dan tidak punya","Subjek + 有 / 没有 + Benda","Penolakan 有 selalu 没有, bukan 不有. 个 (gè) adalah kata penggolong umum: Angka + 个 + Benda.",[["我有一个朋友。","wǒ yǒu yí gè péngyou.","Aku punya seorang teman."],["我没有朋友。","wǒ méiyǒu péngyou.","Aku tidak punya teman."]]]],"6":[["Kemampuan dengan 会","Subjek + 会 + Kata kerja","会 (huì) berarti 'bisa karena sudah dipelajari' (bahasa, keterampilan). Penolakannya 不会.",[["我会说汉语。","wǒ huì shuō Hànyǔ.","Aku bisa berbahasa Mandarin."],["我不会写。","wǒ bú huì xiě.","Aku belum bisa menulis."]]],["Menyambung dengan 和","A + 和 + B","和 (hé) menyambung dua kata benda atau kata ganti, bukan dua kalimat.",[["我和他","wǒ hé tā","aku dan dia"]]]],"7":[["Waktu tanpa 是","Waktu + Waktu (tanpa 是)","Untuk menyatakan hari atau jam, cukup menyusun kata waktunya. 星期 + angka = hari (一 = Senin sampai 五 = Jumat). 点 (diǎn) = pukul.",[["今天星期五。","jīntiān xīngqī wǔ.","Hari ini hari Jumat."],["现在三点。","xiànzài sān diǎn.","Sekarang pukul tiga."],["二月","èr yuè","Februari (bulan ke-2)"]]]],"8":[["在 untuk tempat dan 'sedang'","Subjek + 在 + Tempat / 在 + Kata kerja","在 (zài) punya dua fungsi: 'berada di' dan penanda 'sedang' sebelum kata kerja.",[["他在前面。","tā zài qiánmiàn.","Dia ada di depan."],["我在睡觉。","wǒ zài shuìjiào.","Aku sedang tidur."]]]],"9":[["Kata kerja + benda","Subjek + 吃 / 喝 + Benda","吃 (makan) dipakai untuk makanan, 喝 (minum) untuk minuman. Susunan katanya sama seperti bahasa Indonesia.",[["我吃米饭。","wǒ chī mǐfàn.","Aku makan nasi."],["你喝茶。","nǐ hē chá.","Kamu minum teh."]]]],"10":[["Menanyakan harga","Benda + 多少钱？","多少 (duōshao) = berapa banyak, 钱 = uang. Jawabannya memakai 块 (yuan): 五块 = lima yuan.",[["苹果多少钱？","píngguǒ duōshao qián?","Berapa harga apel?"],["五块。","wǔ kuài.","Lima yuan."]]],["Ingin dan suka","Subjek + 想 / 喜欢 + Kata kerja atau Benda","想 (xiǎng) + kata kerja = ingin melakukan; 喜欢 (xǐhuan) + benda atau kata kerja = suka.",[["我想买衣服。","wǒ xiǎng mǎi yīfu.","Aku ingin membeli pakaian."],["我喜欢苹果。","wǒ xǐhuan píngguǒ.","Aku suka apel."]]]],"11":[["Tempat sebelum kata kerja","Subjek + 在 + Tempat + Kata kerja","Di Mandarin, tempat diletakkan sebelum kata kerja: 在医院工作 ('di rumah sakit bekerja'). 哪儿 (nǎr) = di mana.",[["你在哪儿工作？","nǐ zài nǎr gōngzuò?","Kamu bekerja di mana?"],["我在医院工作。","wǒ zài yīyuàn gōngzuò.","Aku bekerja di rumah sakit."]]]],"12":[["Kalimat tanya dengan 吗","Pernyataan + 吗？","Tambahkan 吗 (ma) di akhir kalimat pernyataan untuk membuat pertanyaan ya atau tidak.",[["你好吗？","nǐ hǎo ma?","Apa kabar?"],["你爱学习吗？","nǐ ài xuéxí ma?","Apakah kamu suka belajar?"]]],["Kata sifat dengan 很","Subjek + 很 + Kata sifat","Kata sifat tidak memakai 是. 很 (hěn) di depan kata sifat terdengar wajar dan artinya ringan 'cukup, sangat'. 太 + sifat = terlalu.",[["今天很热。","jīntiān hěn rè.","Hari ini panas."],["天气怎么样？","tiānqì zěnmeyàng?","Bagaimana cuacanya?"]]]],"13":[["Gerak ke tempat","Subjek + 去 / 来 / 回 + Tempat","去 (pergi), 来 (datang), dan 回 (pulang) sudah mengandung arti 'ke', jadi tidak perlu kata depan tambahan.",[["我去学校。","wǒ qù xuéxiào.","Aku pergi ke sekolah."],["他回家。","tā huí jiā.","Dia pulang."]]],["Menonton dan menelepon","看 + Benda ; 打 + 电话","看 (lihat) dipakai untuk menonton: 看电视, 看电影. 打电话 berarti menelepon (harfiahnya 'memukul telepon').",[["我看电影。","wǒ kàn diànyǐng.","Aku menonton film."],["他打电话。","tā dǎ diànhuà.","Dia menelepon."]]]],"14":[["Menunjuk benda dengan 这 dan 那","这 / 那 + 是 + Benda","这 (zhè) = ini, 那 (nà) = itu. Bertanya tentang orang memakai 谁 (shéi).",[["这是椅子。","zhè shì yǐzi.","Ini kursi."],["他是谁？","tā shì shéi?","Dia siapa?"]]],["Naik kendaraan","坐 + Kendaraan","坐 (zuò) berarti duduk, dan juga 'naik' kendaraan sebagai penumpang.",[["我坐出租车。","wǒ zuò chūzūchē.","Aku naik taksi."]]]],"15":[["Kepemilikan dengan 的","A + 的 + B","的 (de) menghubungkan pemilik dengan miliknya. Untuk kerabat dekat, 的 boleh dihilangkan.",[["我的朋友","wǒ de péngyou","temanku"],["老师的书","lǎoshī de shū","buku guru"]]],["Selesai dengan 了","Kata kerja + 了","了 (le) di belakang kata kerja menandai tindakan yang sudah selesai atau keadaan yang berubah.",[["我吃了。","wǒ chī le.","Aku sudah makan."]]],["Semua dengan 都","Subjek + 都 + Kata kerja","都 (dōu) berarti 'semua' dan diletakkan sebelum kata kerja.",[["我们都是学生。","wǒmen dōu shì xuésheng.","Kami semua adalah siswa."]]]]},"en":{"1":[["Greetings and introductions","Greeting + name ; How are you? - I'm fine","Sapaan berubah menurut waktu: Good morning, Good afternoon, Good evening. Jawaban 'How are you?' biasanya 'I'm fine, thank you.'",[["Good morning, Budi!","","Selamat pagi, Budi!"],["How are you? - I'm fine, thank you.","","Apa kabar? - Saya baik, terima kasih."]]]],"2":[["Angka puluhan","Puluhan - satuan","Angka 21 sampai 99 ditulis puluhan, tanda hubung, lalu satuan: twenty-one.",[["twenty-one","","dua puluh satu"],["I am twelve years old.","","Umur saya dua belas tahun."]]]],"3":[["Hari dengan on","on + hari","Gunakan on di depan nama hari: on Monday. Nama hari selalu diawali huruf kapital.",[["I study English on Monday.","","Saya belajar bahasa Inggris pada hari Senin."],["Sunday is a holiday.","","Hari Minggu adalah hari libur."]]]],"4":[["Bulan dengan in","in + bulan","Gunakan in di depan nama bulan: in May. Nama bulan juga diawali huruf kapital.",[["My birthday is in May.","","Ulang tahunku di bulan Mei."],["School starts in July.","","Sekolah mulai pada bulan Juli."]]]],"5":[["Kepemilikan","my / your + kerabat ; Nama + 's","Tambahkan 's pada nama untuk menyatakan kepemilikan: Budi's father. Untuk 'aku' dipakai my.",[["This is my mother.","","Ini ibuku."],["Budi's father is a teacher.","","Ayah Budi adalah seorang guru."]]]],"6":[["Urutan warna dan benda","Adjektiva + Nomina","Di bahasa Inggris, warna diletakkan sebelum bendanya: a red bag (kebalikan dari 'tas merah').",[["a red bag","","sebuah tas merah"],["The sky is blue.","","Langit berwarna biru."]]]],"7":[["Menyatakan suka dan ingin","I like + benda ; I want + benda","like = suka, want = ingin. Setelah like atau want boleh ada benda.",[["I like noodles.","","Saya suka mi."],["I want some water.","","Saya mau air."]]]],"8":[["Artikel a dan an","a + konsonan ; an + vokal","Pakai an bila kata berikutnya diawali bunyi vokal: an apple, a banana. Untuk jamak atau jumlah tak tentu, pakai some.",[["an apple","","sebuah apel"],["I eat some carrots.","","Saya makan beberapa wortel."]]]],"9":[["Menyatakan keberadaan","There is + tunggal ; There are + jamak","There is untuk satu benda, There are untuk lebih dari satu.",[["There is a cat on the chair.","","Ada seekor kucing di kursi."],["There are two ducks.","","Ada dua ekor bebek."]]]],"10":[["Memiliki anggota tubuh","I / You / We / They have ; He / She has","Bentuk have berubah menjadi has untuk he, she, dan it.",[["I have two eyes.","","Saya punya dua mata."],["She has long hair.","","Dia berambut panjang."]]]],"11":[["Wear dan put on","wear = sedang mengenakan ; put on = memakai","wear menyatakan keadaan sedang mengenakan, put on menyatakan aksi memakai.",[["He wears a blue shirt.","","Dia mengenakan kemeja biru."],["Put on your jacket.","","Pakai jaketmu."]]]],"12":[["Menunjuk benda dengan this dan that","This / That is + a ... ; These / Those are + jamak","this dan that untuk satu benda (dekat dan jauh); these dan those untuk jamak.",[["This is a pencil.","","Ini sebuah pensil."],["Those are my books.","","Itu buku-bukuku."]]]],"13":[["Preposisi tempat","in / on / under / next to","in = di dalam, on = di atas (menempel), under = di bawah, next to = di sebelah.",[["The lamp is on the table.","","Lampu ada di atas meja."],["The bed is in the bedroom.","","Tempat tidur ada di kamar tidur."]]]],"14":[["Simple present","I / You / We / They + V ; He / She / It + V-s","Untuk kebiasaan sehari-hari. Subjek orang ketiga tunggal menambah -s (studies: y berubah menjadi ies).",[["I wake up at six.","","Saya bangun pukul enam."],["She studies every day.","","Dia belajar setiap hari."]]]],"15":[["Menanyakan dan menyebut jam","What time is it? - It's + jam ; at + jam","Gunakan at di depan jam untuk menyebut kapan sesuatu terjadi.",[["What time is it? - It's seven o'clock.","","Jam berapa sekarang? - Pukul tujuh."],["I go to school at seven.","","Saya berangkat ke sekolah pukul tujuh."]]]],"16":[["Pergi ke tempat","go to + tempat","Setelah go biasanya ada to + tempat. Pengecualian: go home (tanpa to).",[["I go to the market.","","Saya pergi ke pasar."],["He goes home.","","Dia pulang."]]]],"17":[["Kendaraan dengan by","by + kendaraan","Gunakan by tanpa kata sandang: by bus, by car, by train.",[["I go to school by bus.","","Saya ke sekolah naik bus."],["Turn left at the bank.","","Belok kiri di bank."]]]],"18":[["Cuaca dengan It is","It is + cuaca","Untuk cuaca selalu dipakai subjek It: It is rainy, It is sunny.",[["It is sunny today.","","Hari ini cerah."],["It is cold in winter.","","Cuaca dingin pada musim dingin."]]]],"19":[["Menyebut pekerjaan","He / She is + a / an + profesi","Sebelum profesi diperlukan a atau an: She is a doctor, He is an engineer.",[["She is a doctor.","","Dia seorang dokter."],["My father is an engineer.","","Ayahku seorang insinyur."]]]],"20":[["Kata sifat setelah be","be (am / is / are) + adjektiva","Adjektiva mengikuti be dan tidak berubah bentuk untuk jamak.",[["The boy is tall.","","Anak laki-laki itu tinggi."],["The room is clean.","","Ruangan itu bersih."]]]],"21":[["Kata tanya","Kata tanya + do / does + subjek + kata kerja","Kata tanya ditaruh di awal kalimat. What = apa, Where = di mana, When = kapan, Who = siapa, Why = mengapa, How = bagaimana.",[["Where do you live?","","Kamu tinggal di mana?"],["What is your name?","","Siapa namamu?"]]]]}};

etik (makna + bunyi)","makna 阝 (kota) + bunyi 完 (dibaca wán)"],"随":["Ideograf (gabungan makna)","阝 (kota) + 迶"],"雨":["Piktograf (gambar benda)","bentuknya berasal dari gambar benda yang dimaksud"],"面":["Piktograf (gambar benda)","bentuknya berasal dari gambar benda yang dimaksud"],"预":["Piktofonetik (makna + bunyi)","makna 页 (halaman) + bunyi 予 (dibaca yǔ)"],"题":["Piktofonetik (makna + bunyi)","makna 页 (halaman) + bunyi 是 (dibaca shì)"],"颜":["Piktofonetik (makna + bunyi)","makna 页 (halaman) + bunyi 彦 (dibaca yàn)"],"飞":["Piktograf (gambar benda)","bentuknya berasal dari gambar benda yang dimaksud"],"饭":["Piktofonetik (makna + bunyi)","makna 饣 (makanan) + bunyi 反 (dibaca fǎn)"],"馆":["Ideograf (gabungan makna)","饣 (makanan) + 官 (pejabat)"],"首":["Ideograf (gabungan makna)","丷 + 自 (diri)"],"马":["Piktograf (gambar benda)","bentuknya berasal dari gambar benda yang dimaksud"],"高":["Piktograf (gambar benda)","bentuknya berasal dari gambar benda yang dimaksud"]};
const KN={"好":"女 (wanita) dan 子 (anak): ibu bersama anaknya adalah gambaran hal yang baik.","你":"亻 (orang) + 尔 (kata 'kamu' dalam bahasa kuno): orang yang ada di hadapanmu.","家":"宀 (atap) di atas 豕 (babi). Konon dulu babi dipelihara di bawah atap rumah, tanda rumah tangga yang menetap dan makmur.","看":"手 (tangan) di atas 目 (mata): tangan menaungi mata untuk melihat jauh.","想":"相 (saling memandang) di atas 心 (hati): memandang dalam hati, artinya ingin atau merindu.","爱":"Aksara tradisional 愛 punya 心 (hati) di tengahnya. Versi sederhana 爱 menghilangkan 心, tetapi tetap memuat 友 (teman) di bawah 冖 (atap).","学":"子 (anak) di bawah 冖 (atap) dengan ⺍ (tangan yang mengajar): anak belajar di dalam bangunan.","明":"日 (matahari) + 月 (bulan): terang karena ada dua sumber cahaya.","人":"Gambar orang berdiri dilihat dari samping.","大":"Gambar orang yang merentangkan kedua tangan: besar.","小":"Tiga titik kecil: sesuatu yang kecil dan terbagi.","水":"Gambar aliran air dengan percikan di kiri dan kanan.","月":"Gambar bulan sabit.","女":"Gambar wanita yang berlutut dengan tangan bersilang di depan.","子":"Gambar bayi dengan kepala besar dan tangan terentang."};
const KW={"你好":"你 (kamu) + 好 (baik): harfiahnya 'kamu baik', maksudnya 'semoga kamu baik-baik saja'.","谢谢":"Pengulangan 谢 membuat ucapan lebih hangat. 谢 memakai 讠 (ucapan): terima kasih adalah soal kata-kata.","再见":"再 (lagi) + 见 (bertemu): 'sampai bertemu lagi'.","对不起":"对 (berhadapan) + 不 (tidak) + 起 (sanggup): 'tak sanggup menghadapimu', ungkapan malu karena bersalah.","没关系":"没 (tidak ada) + 关系 (hubungan): 'tidak ada kaitannya', maksudnya tidak masalah.","不客气":"不 (jangan) + 客气 (sungkan seperti tamu): 'jangan sungkan'.","朋友":"朋 awalnya dua untai kerang (harta) yang berdampingan; 友 adalah dua tangan yang saling berjabat. Teman adalah yang berdampingan dan saling menolong.","东西":"东 (timur) + 西 (barat). Konon berasal dari pasar timur dan pasar barat di kota kuno, tempat orang membeli barang.","电脑":"电 (listrik) + 脑 (otak): 'otak listrik', yaitu komputer.","电视":"电 (listrik) + 视 (melihat): 'penglihatan listrik', yaitu televisi.","电影":"电 (listrik) + 影 (bayangan): 'bayangan listrik', yaitu film.","学习":"学 = anak belajar di bawah atap; 习 (習) = bulu burung yang berlatih terbang. Belajar berarti terus berlatih seperti anak burung mengepakkan sayap.","睡觉":"睡: 目 (mata) + 垂 (menggantung): kelopak mata yang menggantung.","喜欢":"喜 = bahagia, 欢 = ceria. Menyukai sesuatu berarti hatimu bahagia dan ceria karenanya.","高兴":"高 (tinggi) + 兴 (semangat): semangat yang tinggi, yaitu gembira.","医院":"医 (pengobatan) + 院 (kompleks bangunan): tempat berobat.","出租车":"出租 (disewakan) + 车 (kendaraan): kendaraan sewaan, yaitu taksi.","飞机":"飞 (terbang) + 机 (mesin): mesin terbang, yaitu pesawat.","商店":"商 (dagang) + 店 (toko): toko tempat berdagang.","老师":"老 (tua, berpengalaman) + 师 (guru): orang berpengalaman yang membimbing.","Monday":"Dari Old English 'Moon's day': hari Bulan.","Thursday":"'Thor's day': hari Thor, dewa petir bangsa Nordik.","Saturday":"'Saturn's day': hari Saturnus, satu-satunya nama hari dari dewa Romawi.","January":"Dari Janus, dewa Romawi berwajah dua yang menatap masa lalu dan masa depan.","March":"Dari Mars, dewa perang Romawi. Dulu tahun Romawi dimulai pada bulan Maret.","September":"Latin septem = tujuh. Dulu bulan ketujuh (tahun dimulai Maret), sekarang bulan kesembilan.","October":"Latin octo = delapan. Dulu bulan kedelapan.","November":"Latin novem = sembilan. Dulu bulan kesembilan.","December":"Latin decem = sepuluh. Dulu bulan kesepuluh.","Eat breakfast":"Breakfast = break + fast: memutus puasa semalam.","Orange":"Dari Sanskerta naranga lewat bahasa Arab dan Prancis. Warnanya dinamai dari buahnya, bukan sebaliknya.","Potato":"Dari batata, kata suku Taino untuk ubi manis.","Tea":"Dari kata Hokkien 'te', sama dengan 茶 (chá) di Mandarin.","Coffee":"Dari bahasa Arab qahwa lewat bahasa Turki kahve.","Hospital":"Latin hospes = tamu: tempat menerima tamu yang butuh pertolongan. Satu akar dengan hotel dan hospitality.","Pencil":"Latin penicillus = 'ekor kecil', kuas kecil yang dulu dipakai menulis.","Library":"Latin liber = buku.","Restaurant":"Prancis restaurer = memulihkan: awalnya kaldu penguat tenaga.","Chef":"Prancis chef = kepala, satu akar dengan chief (pemimpin).","Uniform":"uni (satu) + form (bentuk): satu bentuk untuk semua.","Student":"Latin studere = bersungguh-sungguh: siswa adalah orang yang bersungguh-sungguh belajar.","Window":"Dari Norse vindauga = 'mata angin' (vindr angin + auga mata).","Elephant":"Dari Yunani elephas, yang berarti gading.","Bank":"Italia banca = bangku: penukar uang zaman dulu duduk di bangku."};
function mat(id){
 loc=["mat",id];
 const l=lv().find(z=>z.id==id),M=(MAT[lang]||{})[id]||[],zh=lang=="zh";
 const bt=t=>`<button class="sm" data-t="${esc(t)}" onclick="sp(this.dataset.t,this)" title="Dengarkan" aria-label="Dengarkan">🔊</button>`;
 let h=`<div class=hd><button class=sm onclick="lvScreen(${id})">Kembali</button>${themeBtn()}</div><h2 style="margin-top:1rem">Materi: ${esc(l.name)}</h2>`;
 if(M.length)h+="<h3>Pola kalimat</h3>"+M.map(p=>`<div class=pt><b>${esc(p[0])}</b><div class=fm>${esc(p[1])}</div><p>${esc(p[2])}</p>${p[3].map(e=>`<div class=ex>${bt(e[0])}<div><span class=ek>${esc(e[0])}</span>${e[1]?`<br><small>${esc(e[1])}</small>`:""}<br><span class=mut>${esc(e[2])}</span></div></div>`).join("")}</div>`).join("");
 h+="<h3>Pembahasan kata</h3>"+l.it.map((x,j)=>{
  let b="";
  if(zh)b=[...x.w].filter(c=>/[\u4e00-\u9fff]/.test(c)).map((c,ci)=>{const k=KAR[c];return `<div class=cp><span class=hc>${esc(c)}</span> ${k?`<b>${esc(k[0])}</b>: ${esc(k[1])}`:""}${KN[c]?`<div class=nt>💡 ${esc(KN[c])}</div>`:""} <button class="sm" onclick="hzv(${id},${j},${ci})" title="Cara menulis ${esc(c)}" aria-label="Cara menulis ${esc(c)}">✍️</button></div>`}).join("");
  if(KW[x.w])b+=`<div class="cp nt">💡 ${esc(KW[x.w])}</div>`;
  return `<div class=wd><div class=v>${bt(x.w)}<div><b>${esc(x.w)}</b> <small>${esc(x.r)}</small><br><span class=mut>${esc(x.m)}</span></div></div>${b}</div>`}).join("");
 app.innerHTML=h;
}
function lvScreen(id){loc=["lvScreen",id];
 const l=lv().find(z=>z.id==id);
 app.innerHTML=`<div class=hd><button class=sm onclick="levels(${l.ti})">Kembali</button>${themeBtn()}</div><h2 style="margin-top:1rem">Level ${id}: ${l.name}</h2>${(MAT[lang]||{})[id]?`<button class="btn" onclick="mat(${id})">📖 Pelajari materi: pola kalimat dan pembahasan kata</button>`:""}${l.it.map((x,i)=>`<div class=v><button class=sm data-t="${x.w}" onclick="sp(this.dataset.t,this)">🔊</button>${lang=="zh"?`<button class="sm" onclick="hzv(${l.id},${i},0)" title="Cara menulis" aria-label="Cara menulis ${esc(x.w)}">✍️</button>`:""}<div><b>${x.w}</b> <small>${x.r}</small><br><span class=mut>${x.m}</span></div></div>`).join("")}<h3>Latihan bebas, 5 soal</h3><div class=g>${[["read","📖 Membaca"],["speak","🎤 Mengucapkan"],["write","✍️ Menulis"],["mc","✅ Pilihan ganda"]].map(([t,n])=>`<button class=btn onclick="drill(${id},'${t}')">${n}</button>`).join("")}</div><h3>Ujian naik level</h3><button class=btn onclick="quiz(${id})">Mulai ujian: ${l.n} soal, lulus ${PASS}%</button>`;
}
const mk=(it,n,ty=TY)=>{let a=[],q=[];for(let i=0;i<n;i++){if(i%it.length==0)a=shuf(it);q.push({it:a[i%it.length],ty:ty[i%ty.length]})}return q};
function drill(id,t){const l=lv().find(z=>z.id==id);run(mk(l.it,5,[t]),{kind:"dr",t:0,back:`lvScreen(${id})`})}
function quiz(id){const Ls=lv(),l=Ls.find(z=>z.id==id);run(mk(Ls.filter(z=>z.ti==l.ti&&z.li<=l.li).flatMap(z=>z.it),l.n),{kind:"lv",id,t:PASS,back:`lvScreen(${id})`})}
function exam(ti){run(mk(lv().filter(z=>z.ti==ti).flatMap(z=>z.it),40),{kind:"ex",id:ti,t:EXP,back:`levels(${ti})`})}
function run(q,c){loc=["quiz"];cmb=0;Q=q;ctx=c;k=0;sc=0;ask()}
function ask(){
 if(k>=Q.length)return fin();
 const{w,r,m}=Q[k].it,ty=Q[k].ty,zh=lang=="zh";
 A=zh?`${w} (${r}) = ${m}`:`${w} = ${m}`;
 const o=()=>{const a=shuf(all().filter(x=>x.w!=w)).sort((p,q)=>Math.abs(p.w.length-w.length)-Math.abs(q.w.length-w.length)).slice(0,3);a.push(Q[k].it);return shuf(a)};
 let b="";
 if(ty=="read")b=`<p>Baca, lalu pilih artinya</p><div class=big>${w}</div><button class=sm onclick="sp(Q[k].it.w,this)">🔊 Dengar</button>${o().map(x=>`<button class=opt data-k="${x.w==w?1:0}" onclick="pick(this)">${x.m}</button>`).join("")}`;
 else if(ty=="mc")b=`<p>Pilih terjemahan yang tepat</p><div class=big>${m}</div>${o().map(x=>`<button class=opt data-k="${x.w==w?1:0}" onclick="pick(this)"><span>${x.w}</span><small>${x.r}</small></button>`).join("")}`;
 else if(ty=="write")b=`<p>Tulis dalam ${zh?"hanzi atau pinyin":"bahasa Inggris"}</p><div class=big>${m}</div><input id=ans autocomplete=off autocapitalize=off><button class=btn onclick="chk()">Periksa</button>`;
 else b=`<p>Ucapkan dengan lantang</p><div class=big>${w}</div><small>${r}</small><p class=mut>${m}</p><button class=sm onclick="sp(Q[k].it.w,this)">🔊 Dengar</button> <button class=btn onclick="mic(this)">🎤 Ucapkan</button>`;
 app.innerHTML=`<button class=sm onclick="${ctx.back}">Keluar</button> <span class=mut>Soal ${k+1} dari ${Q.length}</span><div class=q>${b}<div id=fb></div></div>`;
}
function pick(b){const ok=b.dataset.k=="1";document.querySelectorAll(".opt").forEach(x=>{if(x.dataset.k=="1")x.classList.add("ok")});if(!ok)b.classList.add("bad");fb(ok)}
function chk(){const{w,r}=Q[k].it,i=$("#ans"),v=norm(i.value);i.disabled=true;fb(!!v&&(v==norm(w)||(!!r&&v==norm(r))))}
function mic(b){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition,{w,r}=Q[k].it;
 const man=()=>{b.outerHTML=`<button class=btn onclick="fb(true)">Sudah saya ucapkan ✓</button>`};
 if(!SR)return man();
 try{const s=new SR();s.lang=C().l;b.textContent="🎙️ Mendengarkan…";
  s.onresult=e=>{const t=e.results[0][0].transcript,n=norm(t);b.remove();fb(n==norm(w)||(!!r&&n==norm(r)),"Terdengar: "+t)};
  s.onerror=man;s.start()}catch(e){man()}
}
function fb(ok,note){touch();snd(ok?"ok":"no");
 if(ok)sc++;
 document.querySelectorAll(".opt,.btn").forEach(x=>x.disabled=true);
 $("#fb").innerHTML=`<p class="${ok?"good":"nope"}">${ok?"✓ Benar!":"✗ Belum tepat"}${note?". "+note:""}<br><small>${A}</small></p><button class=btn onclick="k++;ask()">Lanjut</button>`;
}
function fin(){
 const p=Math.round(sc/Q.length*100),ok=p>=ctx.t,o=P();snd((ctx.kind=="dr"?p>=PASS:ok)?"win":"lose");
 if(ctx.kind!="dr"){const t=ctx.kind=="lv"?o.p:o.x;if(p>(t[ctx.id]||0)){t[ctx.id]=p;save()}}
 app.innerHTML=`<div class=q><div class=big>${p}%</div><p>${sc} dari ${Q.length} soal benar</p><p class="${ctx.kind=="dr"||ok?"good":"nope"}">${ctx.kind=="dr"?"Latihan selesai. Ulangi sesering mungkin.":ok?"Lulus! Lanjut ke tahap berikutnya.":"Belum lulus, minimal "+ctx.t+"%. Pelajari lagi materinya lalu coba ulang."}</p><button class=btn onclick="${ctx.back}">Kembali</button></div>`;
}
let ip=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;if(loc[0]=="home")home()});
addEventListener("appinstalled",()=>{ip=null;if(loc[0]=="home")home()});
function inst(){if(!ip)return;ip.prompt();ip.userChoice.finally(()=>{ip=null;if(loc[0]=="home")home()})}
start();
try{if(navigator.serviceWorker&&/^https?:/.test(location.protocol))addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}catch(e){}
</script>
