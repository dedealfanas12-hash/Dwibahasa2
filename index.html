const cp=c=>{const L=lv(c),d=L.filter(l=>((S[c]||{p:{}}).p[l.id]||0)>=PASS).length;return[d,L.length,Math.round(d/L.length*100)]};
let AC,OUT,cmb=0;
const SC=[0,2,4,5,7,9,11,12];
function ac(){
 if(!AC){
  AC=new(window.AudioContext||window.webkitAudioContext)();
  OUT=AC.createGain();OUT.gain.value=.8;
  const dl=AC.createDelay(),fk=AC.createGain(),wt=AC.createGain();
  dl.delayTime.value=.14;fk.gain.value=.3;wt.gain.value=.28;
  OUT.connect(AC.destination);OUT.connect(dl);dl.connect(fk);fk.connect(dl);dl.connect(wt);wt.connect(AC.destination);
 }
 if(AC.state=="suspended")AC.resume();
}
const PT={bell:[[1,1,1],[2,.4,.6],[3,.2,.4],[4.2,.12,.3]],soft:[[1,1,1],[2,.3,.6],[3,.1,.4]]};
function nt(f,d,l,k,b,v){
 const s=AC.currentTime+d;
 PT[k].forEach(([m,g,dc])=>{
  const o=AC.createOscillator(),e=AC.createGain(),L=l*dc;
  o.type="sine";o.frequency.setValueAtTime(f*m,s);
  if(b)o.frequency.exponentialRampToValueAtTime(f*m*b,s+L);
  e.gain.setValueAtTime(.0001,s);e.gain.exponentialRampToValueAtTime(.3*g*(v||1),s+.008);e.gain.exponentialRampToValueAtTime(.0001,s+L);
  o.connect(e);e.connect(OUT);o.start(s);o.stop(s+L+.05);
 });
}
function bz(f,d,l,b){
 const s=AC.currentTime+d,o=AC.createOscillator(),e=AC.createGain(),lp=AC.createBiquadFilter();
 o.type="sawtooth";o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*b,s+l);
 lp.type="lowpass";lp.frequency.setValueAtTime(1500,s);lp.frequency.exponentialRampToValueAtTime(450,s+l);
 e.gain.setValueAtTime(.0001,s);e.gain.exponentialRampToValueAtTime(.4,s+.015);e.gain.exponentialRampToValueAtTime(.0001,s+l);
 o.connect(lp);lp.connect(e);e.connect(OUT);o.start(s);o.stop(s+l+.05);
}
function snd(t){
 if(R.mute)return;
 try{
  ac();
  if(t=="ok"||t=="demo"){const m=Math.pow(2,SC[Math.min(cmb,7)]/12);if(t=="ok")cmb++;nt(784*m,0,.4,"bell");nt(1047*m,.09,.8,"bell")}
  else if(t=="no"){cmb=0;bz(330,0,.2,.92);bz(262,.17,.45,.8)}
  else if(t=="win"){
   [[523,0],[659,.09],[784,.18],[1047,.27],[1319,.4]].forEach(([f,d])=>nt(f,d,.45,"bell"));
   [1047,1319,1568,2093].forEach(f=>nt(f,.62,1.4,"bell",0,.6));
   nt(2637,.78,.6,"bell",0,.5);nt(3136,.88,.6,"bell",0,.5);
  }else{[[392,0],[370,.3],[349,.6]].forEach(([f,d])=>bz(f,d,.28,.97));bz(330,.9,.9,.82)}
 }catch(e){}
}
document.addEventListener("click",()=>{try{ac()}catch(e){}},{once:true});
let loc=["home"];
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t=="dark":!!(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches)};
const themeBtn0=()=>`<button class="sm th" onclick="toggleTheme(this)" aria-label="Ganti tema gelap atau terang">${isDark()?"☀️":"🌙"}</button>`;
const themeBtn=()=>`<span class=tb><button class="sm th" onclick="toggleSnd(this)" aria-label="Suara hidup atau mati">${R.mute?"🔇":"🔊"}</button>${themeBtn0()}</span>`;
function toggleSnd(b){R.mute=!R.mute;save();b.textContent=R.mute?"🔇":"🔊";snd("demo")}
function toggleTheme(b){const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;R.theme=t;save();b.textContent=isDark()?"☀️":"🌙"}
let cs="",CL=[],lj="",tm;
const hx=s=>[...new TextEncoder().encode(s.toLowerCase())].map(b=>b.toString(16).padStart(2,"0")).join("");
const cj=async(p,o)=>{const r=await fetch(DB.replace(/\/$/,"")+"/dwibahasa/"+p+".json",o);if(!r.ok)throw new Error(r.status);return r.json()};
const pc=(d,c)=>{const L=lv(c);return Math.round(L.filter(l=>(((d[c]||{}).p||{})[l.id]||0)>=PASS).length/L.length*100)};
const sk=d=>d.last==today()||d.last==yest()?(d.n||0):0;
const snap=u=>({n:u.n,t:u.d.t||0,zh:pc(u.d,"zh"),en:pc(u.d,"en"),st:sk(u.d)});
const num=v=>Math.max(0,Math.min(100,+v||0));
function clean(d){d=d||{};const o={n:Math.min(9999,Math.max(0,+d.n||0))|0,last:/^\d{4}-\d\d-\d\d$/.test(d.last)?d.last:"",t:+d.t||0};
 for(const c in D){const z=d[c]||{};o[c]={p:{},x:{}};for(const k in z.p||{})o[c].p[+k]=num(z.p[k]);for(const k in z.x||{})o[c].x[+k]=num(z.x[k])}
 return o}
function sync(){if(!CLOUD)return;clearTimeout(tm);tm=setTimeout(push,1200)}
async function push(){
 const u=R.u[R.cur];if(!CLOUD||!u)return;
 const k=hx(u.n),b=JSON.stringify({n:u.n,d:u.d,t:u.d.t||0}),j=k+b,o=cs;
 if(j==lj&&cs!="off")return;
 try{await cj("users/"+k,{method:"PUT",body:b});await cj("index/"+k,{method:"PUT",body:JSON.stringify(snap(u))});lj=j;cs="ok"}catch(e){cs="off"}
 if(o!=cs&&loc[0]=="home")home();
}
async function refresh(){
 const u=R.u[R.cur];if(!CLOUD||!u)return;
 try{const c=await cj("users/"+hx(u.n));
  if(c&&c.d&&(+c.t||0)>(u.d.t||0)){u.d=clean(c.d);S=u.d;save();if(loc[0]=="home")home()}else push()
 }catch(e){cs="off";if(loc[0]=="home")home()}
}
addEventListener("online",()=>{if(CLOUD)push()});
function login(){
 loc=["login"];
 const us=R.u.map((u,i)=>`<button class=row onclick="enter(${i})"><span>${esc(u.n)}</span><span>Masuk</span></button>`).join("");
 app.innerHTML=`<div class=hd><h1>Dwibahasa</h1>${themeBtn()}</div><p class=mut>${CLOUD?"Tanpa kata sandi: isi namamu atau pilih dari daftar. Progres tersimpan online, dan siapa saja bisa melihat serta membuka akun mana pun.":"Belajar Mandarin dan Inggris dari dasar sampai mahir. Tanpa akun dan kata sandi: isi namamu, progresmu tersimpan di perangkat ini."}</p><div class=q><label for=nm>Namamu</label><input id=nm maxlength=20 autocomplete=off placeholder="Contoh: Cahaya"><button class=btn onclick="newU()">Mulai belajar</button><div id=er class=nope></div></div>${us?`<h3>Di perangkat ini</h3>${us}`:""}<div id=cl></div>`;
 loadCl();
}
function newU(){
 const n=$("#nm").value.trim().replace(/\s+/g," ");
 if(!n){$("#er").textContent="Isi namamu dulu.";return}
 opn(n);
}
async function opn(n){
 let i=R.u.findIndex(u=>u.n.toLowerCase()==String(n).toLowerCase());
 if(CLOUD){
  $("#er").textContent="Memuat…";
  try{
   const c=await cj("users/"+hx(n));
   if(c&&c.d){const d=clean(c.d);if(i<0){R.u.push({n:String(c.n||n).slice(0,20),d});i=R.u.length-1}else if(d.t>(R.u[i].d.t||0))R.u[i].d=d}
  }catch(e){cs="off"}
 }
 if(i<0){let d={};if(!R.u.length)try{const o=JSON.parse(localStorage.getItem("dwi")||"null");if(o&&typeof o=="object")d=o}catch(e){}R.u.push({n:String(n).slice(0,20),d});i=R.u.length-1}
 R.cur=i;S=R.u[i].d;save();home();
 if(CLOUD)push();
}
function enter(i){R.cur=i;S=R.u[i].d;save();home();refresh()}
async function loadCl(){
 const el=$("#cl");if(!CLOUD||!el)return;
 el.innerHTML="<p class=mut>Memuat daftar pengguna…</p>";
 try{CL=Object.values(await cj("index")||{}).filter(u=>u&&typeof u.n=="string").sort((a,b)=>(+b.t||0)-(+a.t||0));cs="ok"}catch(e){cs="off";el.innerHTML="<p class=mut>Daftar online belum bisa dimuat.</p>";return}
 if(loc[0]!="login")return;
 el.innerHTML=CL.length?"<h3>Semua pengguna</h3>"+CL.map((u,i)=>`<button class=row onclick="opn(CL[${i}].n)"><span>${esc(u.n.slice(0,20))}<br><small>中文 ${num(u.zh)}%, English ${num(u.en)}%, 🔥 ${+u.st||0}</small></span><span>Masuk</span></button>`).join(""):"";
}
async function board(){
 loc=["board"];
 const hd=`<div class=hd><button class=sm onclick="home()">Kembali</button>${themeBtn()}</div><h2 style="margin-top:1rem">Progres semua pengguna</h2>`;
 app.innerHTML=hd+"<p class=mut>Memuat…</p>";
 let L;
 try{L=CLOUD?Object.values(await cj("index")||{}):R.u.map(snap);if(CLOUD)cs="ok"}catch(e){cs="off";app.innerHTML=hd+"<p class=nope>Belum bisa memuat data online. Coba lagi nanti.</p>";return}
 L=L.filter(u=>u&&typeof u.n=="string").sort((a,b)=>((+b.zh||0)+(+b.en||0))-((+a.zh||0)+(+a.en||0)));
 if(loc[0]!="board")return;
 app.innerHTML=hd+(CLOUD?"":"<p class=mut>Mode lokal: hanya pengguna di perangkat ini.</p>")+(L.map(u=>`<div class=ur><b>${esc(u.n.slice(0,20))}</b> <span class=mut>🔥 ${+u.st||0}</span>${["zh","en"].map(c=>`<div style="--acc:var(--${c})"><small>${c=="zh"?"中文":"English"} ${num(u[c])}%</small><span class=bar><i style="width:${num(u[c])}%"></i></span></div>`).join("")}</div>`).join("")||"<p class=mut>Belum ada pengguna.</p>");
}
function start(){if(R.theme)document.documentElement.dataset.theme=R.theme;R.cur>=0&&R.u[R.cur]?(home(),refresh()):login()}
const go=s=>{const m=/^(\w+)\((.*)\)$/.exec(s);window[m[1]](m[2]?JSON.parse(m[2]):undefined)};
function up(){const p=loc[0];
 if(p=="quiz")go(ctx.back);
 else if(p=="lvScreen")levels(lv().find(l=>l.id==loc[1]).ti);
 else if(p=="levels")tiers(lang);
 else if(p=="tiers"||p=="board")home();
 else return false;
 return true}
let armed=0;
const arm=()=>{if(armed)return;armed=1;try{if(!(history.state&&history.state.a)){history.replaceState({a:0},"");history.pushState({a:1},"")}}catch(e){}};
document.addEventListener("click",arm);
window.addEventListener("popstate",()=>{let r=false;try{r=up()}catch(e){}if(r){try{history.pushState({a:1},"")}catch(e){}}else{try{history.back()}catch(e){}}});
function home(){
 loc=["home"];
 const n=streak(),on=S.last==today();
 let h=`<div class=hd><h1>Dwibahasa</h1><div class=tb>${themeBtn()}<div class="fire ${on?"on":""}" title="Streak belajar"><span>🔥</span><b>${n}</b></div></div></div><p class=mut>Halo, <b>${esc(R.u[R.cur].n)}</b>. ${on?"Hari ini sudah belajar, apimu menyala!":n?"Jawab satu soal hari ini untuk menjaga apimu.":"Jawab satu soal hari ini untuk menyalakan api."} <button class=lk onclick="login()">Ganti pengguna</button> <button class=lk onclick="board()">Lihat progres pengguna lain</button></p>${CLOUD?"<small class=mut>"+(cs=="off"?"⚠️ Belum tersinkron, akan dicoba lagi saat online":"☁️ Progresmu tersimpan online")+"</small>":""}${ip?'<button class=btn onclick="inst()">Instal aplikasi di perangkat ini</button>':""}`;
 Object.keys(D).forEach(c=>{const[d,t,p]=cp(c);h+=`<button class="cat ${c}" onclick="tiers('${c}')"><span class=big>${c=="zh"?"中文":"English"}</span><span>${D[c].n}</span><span class=bar><i style="width:${p}%"></i></span><small>${p}% selesai, ${d} dari ${t} level</small></button>`});
 app.innerHTML=h;
}
function tiers(c){
 loc=["tiers"];lang=c;document.body.className=c;
 const L=lv(),p=P();
 let h=`<div class=hd><button class=sm onclick="home()">Kembali</button>${themeBtn()}</div><h2 style="margin-top:1rem">${D[c].n}</h2><p class=mut>Pilih tingkat belajarmu.</p>`;
 TN.forEach((tn,ti)=>{
  const ls=L.filter(l=>l.ti==ti),d=ls.filter(l=>(p.p[l.id]||0)>=PASS).length,pc=Math.round(d/ls.length*100),open=ti==0||(p.x[ti-1]||0)>=EXP;
  h+=`<button class=cat ${open?"":"disabled"} onclick="levels(${ti})"><span class=big>${tn} ${open?"":"🔒"}</span><span class=bar><i style="width:${pc}%"></i></span><small>${open?pc+"% selesai, "+d+" dari "+ls.length+" level":"Lulus ujian akhir "+TN[ti-1]+" untuk membuka"}</small></button>`;
 });
 app.innerHTML=h;
}
function levels(ti){
 loc=["levels",ti];
 const L=lv().filter(l=>l.ti==ti),p=P(),tn=TN[ti],ex=p.x[ti]||0;
 let h=`<div class=hd><button class=sm onclick="tiers('${lang}')">Kembali</button>${themeBtn()}</div><h2 style="margin-top:1rem">${D[lang].n}: ${tn}</h2>`;
 L.forEach(l=>{const s=p.p[l.id]||0,o=lvOpen(l);h+=`<button class=row ${o?"":"disabled"} onclick="lvScreen(${l.id})"><span>Level ${l.id}: ${l.name}<br><small>${l.n} soal ujian</small></span><span>${s>=PASS?"✓ "+s+"%":o?"Mulai":"🔒"}</span></button>`});
 h+=`<button class="row x" ${exOpen(ti)?"":"disabled"} onclick="exam(${ti})"><span>Ujian akhir ${tn}<br><small>40 soal dari seluruh materi ${tn}, lulus ${EXP}%</small></span><span>${ex>=EXP?"✓ "+ex+"%":exOpen(ti)?"Mulai":"🔒"}</span></button>`;
 app.innerHTML=h;
}
function lvScreen(id){loc=["lvScreen",id];
 const l=lv().find(z=>z.id==id);
 app.innerHTML=`<div class=hd><button class=sm onclick="levels(${l.ti})">Kembali</button>${themeBtn()}</div><h2 style="margin-top:1rem">Level ${id}: ${l.name}</h2>${l.it.map(x=>`<div class=v><button class=sm data-t="${x.w}" onclick="sp(this.dataset.t)">🔊</button><div><b>${x.w}</b> <small>${x.r}</small><br><span class=mut>${x.m}</span></div></div>`).join("")}<h3>Latihan bebas, 5 soal</h3><div class=g>${[["read","📖 Membaca"],["speak","🎤 Mengucapkan"],["write","✍️ Menulis"],["mc","✅ Pilihan ganda"]].map(([t,n])=>`<button class=btn onclick="drill(${id},'${t}')">${n}</button>`).join("")}</div><h3>Ujian naik level</h3><button class=btn onclick="quiz(${id})">Mulai ujian: ${l.n} soal, lulus ${PASS}%</button>`;
}
const mk=(it,n,ty=TY)=>{let a=[],q=[];for(let i=0;i<n;i++){if(i%it.length==0)a=shuf(it);q.push({it:a[i%it.length],ty:ty[i%ty.length]})}return q};
function drill(id,t){const l=lv().find(z=>z.id==id);run(mk(l.it,5,[t]),{kind:"dr",t:0,back:`lvScreen(${id})`})}
function quiz(id){const Ls=lv(),l=Ls.find(z=>z.id==id);run(mk(Ls.filter(z=>z.ti==l.ti&&z.li<=l.li).flatMap(z=>z.it),l.n),{kind:"lv",id,t:PASS,back:`lvScreen(${id})`})}
function exam(ti){run(mk(lv().filter(z=>z.ti==ti).flatMap(z=>z.it),40),{kind:"ex",id:ti,t:EXP,back:`levels(${ti})`})}
function run(q,c){loc=["quiz"];cmb=0;Q=q;ctx=c;k=0;sc=0;ask()}
function ask(){
 if(k>=Q.length)return fin();
 const{w,r,m}=Q[k].it,ty=Q[k].ty,zh=lang=="zh";
 A=zh?`${w} (${r}) = ${m}`:`${w} = ${m}`;
 const o=()=>{const a=shuf(all().filter(x=>x.w!=w)).sort((p,q)=>Math.abs(p.w.length-w.length)-Math.abs(q.w.length-w.length)).slice(0,3);a.push(Q[k].it);return shuf(a)};
 let b="";
 if(ty=="read")b=`<p>Baca, lalu pilih artinya</p><div class=big>${w}</div><button class=sm onclick="sp(Q[k].it.w)">🔊 Dengar</button>${o().map(x=>`<button class=opt data-k="${x.w==w?1:0}" onclick="pick(this)">${x.m}</button>`).join("")}`;
 else if(ty=="mc")b=`<p>Pilih terjemahan yang tepat</p><div class=big>${m}</div>${o().map(x=>`<button class=opt data-k="${x.w==w?1:0}" onclick="pick(this)"><span>${x.w}</span><small>${x.r}</small></button>`).join("")}`;
 else if(ty=="write")b=`<p>Tulis dalam ${zh?"hanzi atau pinyin":"bahasa Inggris"}</p><div class=big>${m}</div><input id=ans autocomplete=off autocapitalize=off><button class=btn onclick="chk()">Periksa</button>`;
 else b=`<p>Ucapkan dengan lantang</p><div class=big>${w}</div><small>${r}</small><p class=mut>${m}</p><button class=sm onclick="sp(Q[k].it.w)">🔊 Dengar</button> <button class=btn onclick="mic(this)">🎤 Ucapkan</button>`;
 app.innerHTML=`<button class=sm onclick="${ctx.back}">Keluar</button> <span class=mut>Soal ${k+1} dari ${Q.length}</span><div class=q>${b}<div id=fb></div></div>`;
}
function pick(b){const ok=b.dataset.k=="1";document.querySelectorAll(".opt").forEach(x=>{if(x.dataset.k=="1")x.classList.add("ok")});if(!ok)b.classList.add("bad");fb(ok)}
function chk(){const{w,r}=Q[k].it,i=$("#ans"),v=norm(i.value);i.disabled=true;fb(!!v&&(v==norm(w)||(!!r&&v==norm(r))))}
function mic(b){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition,{w,r}=Q[k].it;
 const man=()=>{b.outerHTML=`<button class=btn onclick="fb(true)">Sudah saya ucapkan ✓</button>`};
 if(!SR)return man();
 try{const s=new SR();s.lang=C().l;b.textContent="🎙️ Mendengarkan…";
  s.onresult=e=>{const t=e.results[0][0].transcript,n=norm(t);b.remove();fb(n==norm(w)||(!!r&&n==norm(r)),"Terdengar: "+t)};
  s.onerror=man;s.start()}catch(e){man()}
}
function fb(ok,note){touch();snd(ok?"ok":"no");
 if(ok)sc++;
 document.querySelectorAll(".opt,.btn").forEach(x=>x.disabled=true);
 $("#fb").innerHTML=`<p class="${ok?"good":"nope"}">${ok?"✓ Benar!":"✗ Belum tepat"}${note?". "+note:""}<br><small>${A}</small></p><button class=btn onclick="k++;ask()">Lanjut</button>`;
}
function fin(){
 const p=Math.round(sc/Q.length*100),ok=p>=ctx.t,o=P();snd((ctx.kind=="dr"?p>=PASS:ok)?"win":"lose");
 if(ctx.kind!="dr"){const t=ctx.kind=="lv"?o.p:o.x;if(p>(t[ctx.id]||0)){t[ctx.id]=p;save()}}
 app.innerHTML=`<div class=q><div class=big>${p}%</div><p>${sc} dari ${Q.length} soal benar</p><p class="${ctx.kind=="dr"||ok?"good":"nope"}">${ctx.kind=="dr"?"Latihan selesai. Ulangi sesering mungkin.":ok?"Lulus! Lanjut ke tahap berikutnya.":"Belum lulus, minimal "+ctx.t+"%. Pelajari lagi materinya lalu coba ulang."}</p><button class=btn onclick="${ctx.back}">Kembali</button></div>`;
}
let ip=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;if(loc[0]=="home")home()});
addEventListener("appinstalled",()=>{ip=null;if(loc[0]=="home")home()});
function inst(){if(!ip)return;ip.prompt();ip.userChoice.finally(()=>{ip=null;if(loc[0]=="home")home()})}
start();
try{if(navigator.serviceWorker&&/^https?:/.test(location.protocol))addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}catch(e){}
</script>
