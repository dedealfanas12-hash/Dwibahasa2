const mk=(it,n,ty=TY)=>{let a=[],q=[];for(let i=0;i<n;i++){if(i%it.length==0)a=shuf(it);q.push({it:a[i%it.length],ty:ty[i%ty.length]})}return q};
function drill(id,t){const l=lv().find(z=>z.id==id);run(mk(l.it,5,[t]),{kind:"dr",t:0,back:`lvScreen(${id})`})}
function quiz(id){const Ls=lv(),l=Ls.find(z=>z.id==id);run(mk(Ls.filter(z=>z.ti==l.ti&&z.li<=l.li).flatMap(z=>z.it),l.n),{kind:"lv",id,t:PASS,back:`lvScreen(${id})`})}
function exam(ti){run(mk(lv().filter(z=>z.ti==ti).flatMap(z=>z.it),40),{kind:"ex",id:ti,t:EXP,back:"home()"})}
function run(q,c){Q=q;ctx=c;k=0;sc=0;ask()}
function ask(){
 if(k>=Q.length)return fin();
 const{w,r,m}=Q[k].it,ty=Q[k].ty,zh=lang=="zh";
 A=zh?`${w} (${r}) = ${m}`:`${w} = ${m}`;
 const o=()=>{const a=shuf(all().filter(x=>x.w!=w)).sort((p,q)=>Math.abs(p.w.length-w.length)-Math.abs(q.w.length-w.length)).slice(0,3);a.push(Q[k].it);return shuf(a)};
 let b="";
 if(ty=="read")b=`<p>Baca, lalu pilih artinya</p><div class=big>${w}</div><button class=sm onclick="sp(Q[k].it.w)">🔊 Dengar</button>${o().map(x=>`<button class=opt data-k="${x.w==w?1:0}" onclick="pick(this)">${x.m}</button>`).join("")}`;
 else if(ty=="mc")b=`<p>Pilih terjemahan yang tepat</p><div class=big>${m}</div>${o().map(x=>`<button class=opt data-k="${x.w==w?1:0}" onclick="pick(this)"><span>${x.w}</span><small>${x.r}</small></button>`).join("")}`;
 else if(ty=="write")b=`<p>Tulis dalam ${zh?"hanzi atau pinyin":"bahasa Inggris"}</p><div class=big>${m}</div><input id=ans autocomplete=off autocapitalize=off><button class=btn onclick="chk()">Periksa</button>`;
 else b=`<p>Ucapkan dengan lantang</p><div class=big>${w}</div><small>${r}</small><p class=mut>${m}</p><button class=sm onclick="sp(Q[k].it.w)">🔊 Dengar</button> <button class=btn onclick="mic(this)">🎤 Ucapkan</button>`;
 app.innerHTML=`<button class=sm onclick="${ctx.back}">Keluar</button> <span class=mut>Soal ${k+1} dari ${Q.length}</span><div class=q>${b}<div id=fb></div></div>`;
}
function pick(b){const ok=b.dataset.k=="1";document.querySelectorAll(".opt").forEach(x=>{if(x.dataset.k=="1")x.classList.add("ok")});if(!ok)b.classList.add("bad");fb(ok)}
function chk(){const{w,r}=Q[k].it,i=$("#ans"),v=norm(i.value);i.disabled=true;fb(!!v&&(v==norm(w)||(!!r&&v==norm(r))))}
function mic(b){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition,{w,r}=Q[k].it;
 const man=()=>{b.outerHTML=`<button class=btn onclick="fb(true)">Sudah saya ucapkan ✓</button>`};
 if(!SR)return man();
 try{const s=new SR();s.lang=C().l;b.textContent="🎙️ Mendengarkan…";
  s.onresult=e=>{const t=e.results[0][0].transcript,n=norm(t);b.remove();fb(n==norm(w)||(!!r&&n==norm(r)),"Terdengar: "+t)};
  s.onerror=man;s.start()}catch(e){man()}
}
function fb(ok,note){
 if(ok)sc++;
 document.querySelectorAll(".opt,.btn").forEach(x=>x.disabled=true);
 $("#fb").innerHTML=`<p class="${ok?"good":"nope"}">${ok?"✓ Benar!":"✗ Belum tepat"}${note?". "+note:""}<br><small>${A}</small></p><button class=btn onclick="k++;ask()">Lanjut</button>`;
}
function fin(){
 const p=Math.round(sc/Q.length*100),ok=p>=ctx.t,o=P();
 if(ctx.kind!="dr"){const t=ctx.kind=="lv"?o.p:o.x;if(p>(t[ctx.id]||0)){t[ctx.id]=p;save()}}
 app.innerHTML=`<div class=q><div class=big>${p}%</div><p>${sc} dari ${Q.length} soal benar</p><p class="${ctx.kind=="dr"||ok?"good":"nope"}">${ctx.kind=="dr"?"Latihan selesai. Ulangi sesering mungkin.":ok?"Lulus! Lanjut ke tahap berikutnya.":"Belum lulus, minimal "+ctx.t+"%. Pelajari lagi materinya lalu coba ulang."}</p><button class=btn onclick="${ctx.back}">Kembali</button></div>`;
}
home();
</script>
</body>
</html>
